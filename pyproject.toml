[project]
name = "iris-search-agent"
version = "0.1.0"
description = "Natural-language clinical query exploration over InterSystems IRIS for Health via FHIR SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "intersystems-irispython>=5.1.0",
    "langgraph>=1.0,<2.0",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "textual>=8.2.7",
    "typer>=0.26.4",
]

[project.scripts]
iris = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/**/*.md"]
force-include = { "config.py" = "config.py", "iris_client.py" = "iris_client.py" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
